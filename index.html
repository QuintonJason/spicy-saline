<!doctype html>
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8">
  <title>Spicy Saline</title>
  <meta name="description" content="A site about saline solution">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">

  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" href="./img/drop.webp">
  <!-- Place favicon.ico in the root directory -->

  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/main.css">

  <meta name="theme-color" content="#fafafa">
</head>

<body>
  <!-- Place your site's HTML here -->

  <div class="outer-most-div">
    <main>
      <div class="intro">
        <h1>Spicy Saline</h1>
        <p>Welcome to Spicy Saline!</p>
        <img class="intro-image" src="./img/giz2.jpg" alt="">
        <p class="centered">
          <a href="#form">Order now</a>
        </p>
        <a href="#">Order now</a>
      </div>

      <div>
        <img src="./img/shot-drink-at-bar-close-up-photo.jpg" alt="">
      </div>

      <h2>Thank you page form</h2>
      <form id="form" action="./thank-you.html">
        <div class="form-element">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-element">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-element">
          <label for="message">Comment</label>
          <textarea id="message" name="message" placeholder="Message"></textarea>
        </div>

        <input type="submit" value="Submit">
      </form>

      <div class="empty"></div>

      <h2>JS form</h2>
      <form id="js-form">
        <div class="form-element">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-element">
          <label for="color">Color:</label>
          <input type="color" id="color" name="color" required>
        </div>

        <label for="option">Select a reason:</label>
        <select id="pet-select">
          <button>
            <selectedcontent></selectedcontent>
          </button>

          <option value="">Please select a pet</option>
          <option value="cat">
            <span class="icon" aria-hidden="true">🐱</span>
            <span class="option-label">Cat</span>
          </option>
          <option value="dog">
            <span class="icon" aria-hidden="true">🐶</span>
            <span class="option-label">Dog</span>
          </option>
          <option value="hamster">
            <span class="icon" aria-hidden="true">🐹</span>
            <span class="option-label">Hamster</span>
          </option>
          <option value="chicken">
            <span class="icon" aria-hidden="true">🐔</span>
            <span class="option-label">Chicken</span>
          </option>
          <option value="fish">
            <span class="icon" aria-hidden="true">🐟</span>
            <span class="option-label">Fish</span>
          </option>
          <option value="snake">
            <span class="icon" aria-hidden="true">🐍</span>
            <span class="option-label">Snake</span>
          </option>
        </select>

        <label for="terms">
          Terms and conditions
        </label>
        <input type="checkbox" id="terms" name="terms" value="message">

        <input class="js-submit-button" type="submit" value="Submit">
      </form>

      <div class="after-submission">
        <h1>Thank you!</h1>
        <p>Thank you for your submission!</p>
        <button class="js-close-button">Close</button>
      </div>

    </main>
  </div>


  <script src="js/main.js"></script>
</body>

</html>
