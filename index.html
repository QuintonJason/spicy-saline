<!doctype html>
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8">
  <title>Spicy Saline</title>
  <meta name="description" content="A site about saline solution">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">

  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" href="./img/drop.webp">
  <!-- Place favicon.ico in the root directory -->

  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/main.css">

  <meta name="theme-color" content="#fafafa">
</head>

<body>
  <!-- Place your site's HTML here -->

  <div class="outer-most-div">
    <main>
      <div class="intro">
        <h1>Spicy Saline</h1>
        <p>Welcome to Spicy Saline!</p>
        <img class="intro-image" src="./img/giz2.jpg" alt="">
        <p class="centered">
          <a href="#form">Order now</a>
        </p>
        <a href="#">Order now</a>
      </div>

      <div>
        <img src="./img/shot-drink-at-bar-close-up-photo.jpg" alt="">
      </div>

      <form id="form" action="./thank-you.html">
        <div class="form-element">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name">
        </div>

        <div class="form-element">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-element">
          <label for="message">Comment</label>
          <textarea id="message" name="message" placeholder="Message"></textarea>
        </div>

        <input type="submit" value="Submit">
      </form>

      <div class="empty"></div>

    </main>
  </div>


  <script src="js/main.js"></script>
</body>

</html>
